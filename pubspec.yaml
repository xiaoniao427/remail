name: remail
description: "A high-fidelity Gmail-inspired Flutter client for the Resend.com email service."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.3+3

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  flutter_widget_from_html: ^0.17.1
  file_picker: ^10.3.10
  path: ^1.9.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
